name: Read-only Preview Prisma subprocess probe
on:
  workflow_dispatch:
    inputs:
      main_sha:
        description: Exact reviewed current main SHA
        required: true
        type: string
      operator_freeze:
        description: Confirm Render and external operators idle with ALL_OPERATORS_IDLE_FREEZE_UNTIL_VERIFIED
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: bbb-preview-deploy
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'buzztimothy/QB-Practice-Lab' && github.ref == 'refs/heads/main' && github.ref_protected && inputs.main_sha == github.sha && github.run_attempt == 1 && inputs.operator_freeze == 'ALL_OPERATORS_IDLE_FREEZE_UNTIL_VERIFIED'
    # Existing environment requires the owner reviewer, main only, and no bypass.
    environment: bbb-preview-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.main_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build reviewed code without operator credentials
        run: |
          build() { env -i PATH="$PATH" HOME="$HOME" pnpm "$@"; }
          build install --frozen-lockfile
          build rebuild
          build db:generate
          build build
      - name: Run the fixed SELECT-only subprocess probe
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.main_sha }}
          OPERATOR_FREEZE: ${{ inputs.operator_freeze }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          PREVIEW_DATABASE_HOST: ${{ vars.PREVIEW_DATABASE_HOST }}
        run: |
          result=0
          node --input-type=module >/dev/null 2>&1 <<'NODE' || result=$?
          try {
            const { previewPrismaProbe } = await import('./dist/scripts/preview-prisma-probe.js');
            process.exitCode = await previewPrismaProbe(process.env);
          } catch {
            process.exitCode = 20;
          }
          NODE
          case "$result" in
            0) echo PRISMA_PROBE_PASS ;;
            10) echo PRISMA_PROBE_RELEASE_GUARD_REJECTED ;;
            11) echo PRISMA_PROBE_SUBPROCESS_START_FAILED ;;
            12) echo PRISMA_PROBE_SUBPROCESS_SIGNALLED ;;
            13) echo PRISMA_PROBE_TIMEOUT ;;
            14) echo PRISMA_PROBE_CONNECTION_FAILED ;;
            15) echo PRISMA_PROBE_TLS_FAILED ;;
            16) echo PRISMA_PROBE_SQL_OR_IDENTITY_FAILED ;;
            17) echo PRISMA_PROBE_CONFIGURATION_FAILED ;;
            18) echo PRISMA_PROBE_HISTORY_FAILED ;;
            19) echo PRISMA_PROBE_ENGINE_FAILED ;;
            21) echo PRISMA_PROBE_TARGET_REJECTED ;;
            22) echo PRISMA_PROBE_DEPENDENCIES_MISMATCH ;;
            *) echo PRISMA_PROBE_UNKNOWN_FAILED ;;
          esac
          test "$result" = 0
