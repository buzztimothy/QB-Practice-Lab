name: Preview invitation recovery
run-name: Preview recovery ${{ inputs.mode }} ${{ inputs.main_sha }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, execute]
        default: preflight
        required: true
      main_sha:
        description: Exact reviewed current main SHA (including this workflow)
        required: true
      preflight_run_id:
        description: Successful separate preflight run at this SHA; required for execute
        required: false
      confirm_student:
        description: Exact approved Student A ID; required for execute
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  # Serialize with the existing deployment workflow; do not interrupt partial recovery.
  group: bbb-preview-deploy
  cancel-in-progress: false
jobs:
  recovery:
    if: github.ref == 'refs/heads/main' && inputs.main_sha == github.sha && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bbb-preview-recovery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.main_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate reviewed source without operator credentials
        env:
          APPROVED_SHA: ${{ inputs.main_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          pnpm install --frozen-lockfile
          pnpm rebuild
          pnpm db:generate
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Guarded preflight or single recovery operation
        run: node dist/scripts/run-preview-recovery-workflow.js
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.main_sha }}
          RECOVERY_MODE: ${{ inputs.mode }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          RECOVERY_CONFIRM: ${{ inputs.confirm_student }}
          NODE_ENV: production
          DEPLOYMENT_TARGET: preview
          DURABLE_RUNTIME_ENABLED: 'true'
          LOCAL_AUTH_ENABLED: 'false'
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          PREVIEW_DATABASE_CONFIRMATION: bbb_practice_preview
          PREVIEW_DATABASE_HOST: ${{ vars.PREVIEW_DATABASE_HOST }}
          APP_ORIGIN: https://preview.clientpracticelabs.com
          CLERK_AUTHORIZED_PARTY: https://preview.clientpracticelabs.com
          CANONICAL_LAB_VERSION: ${{ vars.CANONICAL_LAB_VERSION }}
          SESSION_TTL_SECONDS: ${{ vars.SESSION_TTL_SECONDS }}
          CLERK_INSTANCE_ID: ${{ vars.CLERK_INSTANCE_ID }}
          CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}
          CLERK_AUDIENCE: ${{ vars.CLERK_AUDIENCE }}
          CLERK_SIGN_IN_URL: ${{ vars.CLERK_SIGN_IN_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
