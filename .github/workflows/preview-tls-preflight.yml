name: Preview deployment TLS preflight
on:
  workflow_dispatch:
    inputs:
      main_sha:
        description: Exact reviewed main SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bbb-preview-deploy
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'buzztimothy/QB-Practice-Lab' && github.ref == 'refs/heads/main' && inputs.main_sha == github.sha && github.run_attempt == 1
    # Required owner reviewer, main-only branch policy and disabled bypass are
    # configured on this environment. See docs/operations/RELEASE-FENCE-ONCE.md.
    environment: bbb-preview-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build reviewed code without database credentials
        run: |
          pnpm install --frozen-lockfile
          pnpm rebuild
          pnpm db:generate
          pnpm build
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Confirm reviewed SHA is still main
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Verify TLS on the protected deployment connection
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          PREVIEW_DATABASE_HOST: ${{ vars.PREVIEW_DATABASE_HOST }}
        run: |
          result=0
          node --input-type=module >/dev/null 2>&1 <<'NODE' || result=$?
          try {
            const { diagnosePreviewTls } = await import('./dist/scripts/preview-tls-preflight.js');
            process.exitCode = await diagnosePreviewTls(process.env);
          } catch {
            process.exitCode = 16;
          }
          NODE
          case "$result" in
            0) echo TLS_PREFLIGHT_PASS ;;
            10) echo TLS_PREFLIGHT_TARGET_REJECTED ;;
            11) echo TLS_PREFLIGHT_CONNECTION_FAILED ;;
            12) echo TLS_PREFLIGHT_QUERY_FAILED ;;
            13) echo TLS_PREFLIGHT_IDENTITY_MISMATCH ;;
            14) echo TLS_PREFLIGHT_BACKEND_TLS_FALSE ;;
            15) echo TLS_PREFLIGHT_TLS_UNAVAILABLE ;;
            *) echo TLS_PREFLIGHT_INTERNAL_FAILED ;;
          esac
          test "$result" = 0
