name: One-time Preview release fence installation
on:
  workflow_dispatch:
    inputs:
      main_sha:
        description: Exact reviewed current main SHA including PR29 and this installer
        required: true
      operator_freeze:
        description: Confirm Render and all external operators idle; enter ALL_OPERATORS_IDLE_FREEZE_UNTIL_VERIFIED
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: bbb-preview-deploy
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main' && inputs.main_sha == github.sha && github.run_attempt == 1
    environment: bbb-preview-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.main_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build reviewed code without operator credentials
        run: |
          pnpm install --frozen-lockfile
          pnpm rebuild
          pnpm db:generate
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Install only tracked release fence migration
        run: node dist/scripts/install-preview-release-fence.js
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.main_sha }}
          OPERATOR_FREEZE: ${{ inputs.operator_freeze }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          PREVIEW_DATABASE_HOST: ${{ vars.PREVIEW_DATABASE_HOST }}
