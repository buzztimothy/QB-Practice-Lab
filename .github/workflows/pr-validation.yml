name: Practice Lab PR validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable_fixture
          POSTGRES_DB: qb_fence_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qb_fence_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild
      - run: pnpm db:generate
      - name: Prepare disposable database roles
        env:
          PGPASSWORD: disposable_fixture
        run: |
          psql -h localhost -U postgres -d qb_fence_validation -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bbb_preview_deploy_lp LOGIN PASSWORD 'disposable_deploy';
          CREATE ROLE bbb_preview_runtime_lp NOLOGIN;
          ALTER DATABASE qb_fence_validation OWNER TO bbb_preview_deploy_lp;
          SQL
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Run application and disposable fence migration tests
        env:
          DATABASE_LIFECYCLE_MARKER: disposable-test
          FENCE_INSTALL_TEST_DATABASE_URL: postgresql://bbb_preview_deploy_lp:disposable_deploy@localhost:5432/qb_fence_validation?sslmode=disable
        run: pnpm test
